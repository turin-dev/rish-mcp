# Dokploy/Traefik deployment for the Go relay and public release server.
# MCP_HOST is private: it exposes /mcp, /agent, and OAuth.
# PUBLIC_MCP_HOST is public: it serves only release metadata and the APK.
services:
  rish-mcp-relay:
    build:
      context: ./server
      target: relay
    image: rishmcp-relay:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid,nodev
    environment:
      PORT: "8080"
      PUBLIC_URL: "https://${MCP_HOST}"
      AI_TOKEN: "${AI_TOKEN:?AI_TOKEN is required}"
      DEVICE_TOKEN: "${DEVICE_TOKEN:?DEVICE_TOKEN is required}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      DEFAULT_TIMEOUT_MS: "${DEFAULT_TIMEOUT_MS:-60000}"
      MAX_TIMEOUT_MS: "${MAX_TIMEOUT_MS:-600000}"
    labels:
      - traefik.enable=true
      - traefik.http.routers.rishmcp.rule=Host(`${MCP_HOST}`)
      - traefik.http.routers.rishmcp.entrypoints=websecure
      - traefik.http.routers.rishmcp.tls.certresolver=letsencrypt
      - traefik.http.services.rishmcp.loadbalancer.server.port=8080
    networks:
      - dokploy-network

  rish-mcp-public:
    build:
      context: ./server
      target: publicserver
    image: rishmcp-public:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid,nodev
    environment:
      PORT: "8080"
      GITHUB_REPO: "${GITHUB_REPO:-turin-dev/rish-mcp}"
      RELEASE_CACHE_DIR: /var/cache/rish-mcp
      DOWNLOADS_PER_HOUR: "${DOWNLOADS_PER_HOUR:-30}"
      RELEASE_POLL_MS: "${RELEASE_POLL_MS:-900000}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
    volumes:
      - public-release:/var/cache/rish-mcp
    labels:
      - traefik.enable=true
      - traefik.http.routers.rishmcp-public.rule=Host(`${PUBLIC_MCP_HOST}`)
      - traefik.http.routers.rishmcp-public.entrypoints=websecure
      - traefik.http.routers.rishmcp-public.tls.certresolver=letsencrypt
      - traefik.http.services.rishmcp-public.loadbalancer.server.port=8080
    networks:
      - dokploy-network

volumes:
  public-release:

networks:
  dokploy-network:
    external: true
