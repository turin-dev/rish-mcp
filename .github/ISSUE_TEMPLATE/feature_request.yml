name: Feature request
description: Propose a focused improvement to the current rewrite.
title: "[Feature]: "
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Android agent
        - Go relay or MCP server
        - Public APK/version server
        - Setup CLI
        - Product website
        - Docker or deployment
        - Documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem, not only the proposed implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include observable behavior, compatibility, and failure handling.
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security and device impact
      description: Explain changes to permissions, shell access, authentication, network exposure, or release trust.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is for an owner's own device and does not assume a multi-tenant service.
          required: true
