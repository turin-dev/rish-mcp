name: CI

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: End-to-end smoke test
        run: node test/smoke.mjs

  android:
    name: Android + Wear OS APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build universal APK
        working-directory: app
        env:
          DOCKER: docker
          KEYSTORE_PASSWORD: ci-rishmcp
          KEY_ALIAS: rishmcp
          KEY_PASSWORD: ci-rishmcp
        run: |
          chmod +x ./build-apk.sh
          ./build-apk.sh

      - name: Show APK info
        run: |
          ls -lh app/rish-mcp-agent.apk
          sha256sum app/rish-mcp-agent.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rish-mcp-agent-${{ github.sha }}
          path: app/rish-mcp-agent.apk
          if-no-files-found: error
          retention-days: 14
