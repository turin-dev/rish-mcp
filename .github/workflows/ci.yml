name: CI

on:
  # Development branches are covered by their pull request. Adding them here too
  # would run the (slow) Android build twice per commit — push and pull_request
  # produce different github.ref values, so concurrency cannot dedupe them.
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: End-to-end smoke test
        run: node test/smoke.mjs

  android-check:
    name: Android + Wear OS test APK
    if: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build test APK
        working-directory: app
        env:
          DOCKER: docker
          KEYSTORE_PASSWORD: ci-rishmcp
          KEY_ALIAS: rishmcp
          KEY_PASSWORD: ci-rishmcp
        run: |
          chmod +x ./build-apk.sh
          ./build-apk.sh

      - name: Create checksum
        run: |
          sha256sum app/rish-mcp-agent.apk | tee app/rish-mcp-agent.apk.sha256

      # The `server` job runs without an APK, so it only covers the fallback
      # path. Re-run the suite here, where a real APK exists, to exercise the
      # binary-manifest parser behind /api/version/release against a genuine
      # build — a silently wrong parse would report every device as up to date.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Smoke test against the built APK
        working-directory: server
        run: |
          npm ci
          npm run build
          node test/smoke.mjs

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: rish-mcp-test-${{ github.sha }}
          path: |
            app/rish-mcp-agent.apk
            app/rish-mcp-agent.apk.sha256
          if-no-files-found: error
          retention-days: 14

  official-apk:
    name: Official signed Android + Wear OS APK
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore official signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          chmod 600 app/release.keystore
          keytool -list \
            -keystore app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build official APK
        working-directory: app
        env:
          DOCKER: docker
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./build-apk.sh
          ./build-apk.sh

      - name: Verify APK signature
        working-directory: app
        run: |
          docker run --rm \
            -v "$PWD":/work \
            rishmcp-android-build \
            /opt/android-sdk/build-tools/35.0.0/apksigner verify \
              --verbose --print-certs /work/rish-mcp-agent.apk

      - name: Create official checksum
        run: |
          sha256sum app/rish-mcp-agent.apk | tee app/rish-mcp-agent.apk.sha256
          ls -lh app/rish-mcp-agent.apk app/rish-mcp-agent.apk.sha256

      - name: Upload official APK
        uses: actions/upload-artifact@v4
        with:
          name: rish-mcp-official-${{ github.sha }}
          path: |
            app/rish-mcp-agent.apk
            app/rish-mcp-agent.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f app/release.keystore
